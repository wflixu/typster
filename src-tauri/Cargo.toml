[package]
name = "typster"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.60"

[lib]
name = "typster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
arboard = "3.3"
base64 = "0.22"
enumset = { version = "1.1", features = ["serde"] }
png = "0.17"
parking_lot = "0.12.1"
rayon = "1.7.0"

hex = "0.4"

tauri = { version = "2.9.3", features = [ "macos-private-api", "devtools", ] }

tauri-plugin-clipboard = "2"
tauri-plugin-fs = "2.4.4"
tauri-plugin-dialog = "2.4.2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
serde_repr = "0.1.20"

siphasher = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }


log = "0.4.28"
env_logger = "0.11.8"
notify = "6.1"
comemo = "0.5.0"
chrono = { version = "0.4.24", default-features = false, features = ["clock", "std", "serde"] }
dirs = "5.0"
memmap2 = "0.9"
once_cell = "1.19"
num_cpus = "1.16"
codespan-reporting = "0.11"
pathdiff = "0.2"
open = "5.0.1"
fs_extra = "1.3"

typst = { version = "0.14.0" }
typst-ide = { version = "0.14.0" }
typst-pdf = { version = "0.14.0" }
typst-html = { version = "0.14.0" }
typst-svg = {  version = "0.14.0" }
typst-render = { version = "0.14.0" }
typst-syntax = { version = "0.14.0" }
typst-kit = { version = "0.14.0" }
typst-timing = {  version = "0.14.0" }
typst-utils = {  version = "0.14.0" }
typst-macros = {  version = "0.14.0" }
typst-eval = {  version = "0.14.0" }

ureq = { version = "2", default-features = false, features = ["native-tls", "gzip", "json"] }
ecow = { version = "0.2.6", features = ["serde"] }
native-tls = "0.2.14"
env_proxy = "0.4"
flate2 = "1"
tar = "0.4.44"
toml = "0.9.8"

[profile.dev]
incremental = true

[profile.release]
incremental = true
